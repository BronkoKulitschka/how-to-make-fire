<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b322e"><title>How to Make Fire</title>
<style>
*{box-sizing:border-box}html,body,main{margin:0;width:100%;height:100%;overflow:hidden;background:#343e3d}
main{position:relative;isolation:isolate;background:radial-gradient(circle at 55% 9%,#ffe6ac 0 .9%,transparent 1.15%),radial-gradient(ellipse 24% 25% at 55% 10%,#ffdaa0 0%,#ddbd91 42%,transparent 100%),linear-gradient(#939e98,#e0b995 20%,#d3c5a3 36%,#9c9d84 58%,#525e49)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
#glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(21,28,49,var(--dusk,0)),rgba(23,29,44,var(--dusk,0))),radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(18,25,25,.24) 100%)}
#thought{position:absolute;pointer-events:none;bottom:max(7%,env(safe-area-inset-bottom));width:100%;padding:0 9%;text-align:center;font:italic clamp(15px,2vw,21px)/1.5 Georgia,serif;color:#fff3d8;text-shadow:0 1px 6px #151712,0 0 16px #000;opacity:0;transition:opacity .35s}
noscript{position:absolute;padding:1rem;color:white}
</style></head><body><main><canvas aria-label="Feuerstelle in einem Wald. Mit der Szene direkt interagieren."></canvas><div id="glass"></div><div id="thought" role="status"></div><noscript>Zum Spielen wird JavaScript benötigt.</noscript></main>
<script src="game.js"></script><script src="mesh.js"></script><script src="world.js"></script><script src="render.js"></script></body></html>
